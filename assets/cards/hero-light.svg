<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Janat Yasser. I build machine-learning systems, then check whether their numbers hold up on data they've never seen. Figure: on HAM10000, a model validated on a leaky image-level split scored 0.858 on validation and 0.727 on the official test set; split by lesion, 0.790 and 0.744."><title>Janat Yasser. I build machine-learning systems, then check whether their numbers hold up on data they've never seen. Figure: on HAM10000, a model validated on a leaky image-level split scored 0.858 on validation and 0.727 on the official test set; split by lesion, 0.790 and 0.744.</title><style>@font-face{font-family:Fr;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:In;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:In6;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:Jb;src:url(data:font/woff2;base64,) format("woff2");}.fade{animation:fade .8s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.3s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@media (prefers-reduced-motion: reduce){.draw{stroke-dashoffset:0}}</style><rect x="1" y="1" width="878" height="318" rx="16" fill="#fbfaf7" stroke="#e4e0d8" stroke-width="1.5"/><text x="44" y="60" font-family="Jb" font-size="11" fill="#8e95a1" text-anchor="start" letter-spacing="2.5" class="fade">LAB NOTEBOOK</text><text x="40" y="128" font-family="Fr" font-size="60" fill="#16181d" text-anchor="start" class="rise" style="animation-delay:0.1s">Janat Yasser</text><text x="44" y="170" font-family="In" font-size="16" fill="#565d69" text-anchor="start" class="rise" style="animation-delay:0.35s">I build machine-learning systems, then check</text><text x="44" y="193" font-family="In" font-size="16" fill="#565d69" text-anchor="start" class="rise" style="animation-delay:0.45s">whether their numbers hold up on data they've never seen.</text><line x1="44" y1="226" x2="84" y2="226" stroke="#e4e0d8" stroke-width="2" class="fade" style="animation-delay:0.6s"/><text x="44" y="254" font-family="In" font-size="13" fill="#8e95a1" text-anchor="start" class="fade" style="animation-delay:2.6s">Fig. 1. HAM10000 skin lesions. With photos of the same mole on both sides</text><text x="44" y="273" font-family="In" font-size="13" fill="#8e95a1" text-anchor="start" class="fade" style="animation-delay:2.7s">of the split, validation flattered the model by 13 points. The official</text><text x="44" y="292" font-family="In" font-size="13" fill="#8e95a1" text-anchor="start" class="fade" style="animation-delay:2.8000000000000003s">test set didn't. Split by lesion, the drop was under 5.</text><text x="846" y="60" font-family="Jb" font-size="10.5" fill="#8e95a1" text-anchor="end" letter-spacing="1.2" class="fade" style="animation-delay:0.5s">FIG. 1  BALANCED ACCURACY, TWO SPLITS</text><line x1="640" y1="84" x2="640" y2="268" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="3 4" class="fade" style="animation-delay:0.6s"/><text x="640" y="288" font-family="In" font-size="12.5" fill="#565d69" text-anchor="middle" class="fade" style="animation-delay:0.7s">validation</text><line x1="790" y1="84" x2="790" y2="268" stroke="#e4e0d8" stroke-width="1.5" stroke-dasharray="3 4" class="fade" style="animation-delay:0.6s"/><text x="790" y="288" font-family="In" font-size="12.5" fill="#565d69" text-anchor="middle" class="fade" style="animation-delay:0.7s">official test</text><path d="M640 112.8 L790 236.5" stroke="#e4572e" stroke-width="3.2" fill="none" stroke-linecap="round" class="draw" style="--l:196;animation-delay:1.0s"/><circle cx="640" cy="112.8" r="5.5" fill="#e4572e" class="pop" style="animation-delay:1.0s"/><circle cx="790" cy="236.5" r="5.5" fill="#e4572e" class="pop" style="animation-delay:2.25s"/><text x="626" y="109.77777777777774" font-family="In6" font-size="12.5" fill="#e4572e" text-anchor="end" class="fade" style="animation-delay:1.0s">split by image</text><text x="626" y="125.77777777777774" font-family="Jb" font-size="11.5" fill="#565d69" text-anchor="end" class="fade" style="animation-delay:1.0s">0.858</text><text x="804" y="240.49999999999997" font-family="Jb" font-size="12" fill="#e4572e" text-anchor="start" class="fade" style="animation-delay:2.25s">0.727</text><path d="M640 177.0 L790 220.4" stroke="#3346d3" stroke-width="3.2" fill="none" stroke-linecap="round" class="draw" style="--l:158;animation-delay:1.25s"/><circle cx="640" cy="177.0" r="5.5" fill="#3346d3" class="pop" style="animation-delay:1.25s"/><circle cx="790" cy="220.4" r="5.5" fill="#3346d3" class="pop" style="animation-delay:2.5s"/><text x="626" y="173.99999999999994" font-family="In6" font-size="12.5" fill="#3346d3" text-anchor="end" class="fade" style="animation-delay:1.25s">split by lesion</text><text x="626" y="189.99999999999994" font-family="Jb" font-size="11.5" fill="#565d69" text-anchor="end" class="fade" style="animation-delay:1.25s">0.790</text><text x="804" y="224.4444444444444" font-family="Jb" font-size="12" fill="#3346d3" text-anchor="start" class="fade" style="animation-delay:2.5s">0.744</text><text x="725.0" y="162.63888888888886" font-family="Jb" font-size="12.5" fill="#e4572e" text-anchor="middle" class="rise" style="animation-delay:2.4s">−13.2</text><text x="709.0" y="220.72222222222217" font-family="Jb" font-size="12.5" fill="#3346d3" text-anchor="middle" class="rise" style="animation-delay:2.55s">−4.6</text></svg>