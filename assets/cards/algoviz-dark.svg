<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 132" width="280" height="132" role="img" aria-label="AlgoViz: bars swapping places as a sort runs." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>AlgoViz: bars swapping places as a sort runs.</title><style>@font-face{font-family:Fr;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:In;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:Jb;src:url(data:font/woff2;base64,) format("woff2");}.fade{animation:fade .8s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.swapA{animation:swapA 3.2s ease-in-out infinite}.swapB{animation:swapB 3.2s ease-in-out infinite}@keyframes swapA{0%,25%{transform:none}45%,100%{transform:translateX(40px)}}@keyframes swapB{0%,25%{transform:none}45%,100%{transform:translateX(-40px)}}.hot{animation:hot 3.2s ease-in-out infinite}@keyframes hot{0%,15%,55%,100%{opacity:0}22%,45%{opacity:1}}</style><rect x="1" y="1" width="278" height="130" rx="16" fill="#11161d" stroke="#262d37" stroke-width="1.5"/><text x="20" y="38" font-family="Fr" font-size="17.5" fill="#e9ebef" text-anchor="start">AlgoViz</text><text x="260" y="36" font-family="Jb" font-size="10" fill="#8b97ff" text-anchor="end" letter-spacing="1.2">LIVE ↗</text><text x="20" y="58" font-family="In" font-size="12" fill="#a5acb7" text-anchor="start">Sorts, paths and trees, step by step.</text><rect x="20" y="94" width="15" height="22" rx="3" fill="#6f7784" opacity=".55"/><rect x="40" y="76" width="15" height="40" rx="3" fill="#6f7784" opacity=".55"/><rect x="60" y="102" width="15" height="14" rx="3" fill="#6f7784" opacity=".55"/><g class="swapA"><rect x="80" y="82" width="15" height="34" rx="3" fill="#6f7784" opacity=".55"/><rect