<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Janat Yasser. i code occasionally. Figure: on HAM10000, a model validated on a leaky image-level split scored 0.853 on validation and 0.716 on the official test set (mean of three seeds); split by lesion, 0.779 and 0.731."><title>Janat Yasser. i code occasionally. Figure: on HAM10000, a model validated on a leaky image-level split scored 0.853 on validation and 0.716 on the official test set (mean of three seeds); split by lesion, 0.779 and 0.731.</title><style>@font-face{font-family:Fr;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:In;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:In6;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:Jb;src:url(data:font/woff2;base64,) format("woff2");}.fade{animation:fade .8s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.3s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@media (prefers-reduced-motion: reduce){.draw{stroke-dashoffset:0}}</style><rect x="1" y="1" width="878" height="318" rx="16" fill="#11161d" stroke="#262d37" stroke-width="1.5"/><text x="44" y="60" font-family="Jb" font-size="11" fill="#6f7784" text-anchor="start" letter-spacing="2.5" class="fade">LAB NOTEBOOK</text><text x="40" y="128" font-family="Fr" font-size="60" fill="#e9ebef" text-anchor="start" class="rise" style="animation-delay:0.1s">Janat Yasser</text><text x="44" y="176" font-family="In" font-size="17" fill="#a5acb7" text-anchor="start" class="rise" style="animation-delay:0.35s">i code occasionally</text><line x1="44" y1="226" x2="84" y2="226" stroke="#262d37" stroke-width="2" class="fade" style="animation-delay:0.6s"/><text x="44" y="254" font-family="In" font-size="13" fill="#6f7784" text-anchor="start" class="fade" style="animation-delay:2.6s">Fig. 1. HAM10000 skin lesions. With photos of the same mole on both sides</text><text x="44" y="273" font-family="In" font-size="13" fill="#6f7784" text-anchor="start" class="fade" style="animation-delay:2.7s">of the split, validation flattered the model by 13.7 points (3 seeds).</text><text x="44" y="292" font-family="In" font-size="13" fill="#6f7784" text-anchor="start" class="fade" style="animation-delay:2.8000000000000003s">The official test set didn't. Split by lesion, the drop was 4.8.</text><text x="846" y="60" font-family="Jb" font-size="10.5" fill="#6f7784" text-anchor="end" letter-spacing="1.2" class="fade" style="animation-delay:0.5s">FIG. 1  BALANCED ACCURACY, TWO SPLITS, 3 SEEDS</text><line x1="640" y1="84" x2="640" y2="268" stroke="#262d37" stroke-width="1.5" stroke-dasharray="3 4" class="fade" style="animation-delay:0.6s"/><text x="640" y="288" font-family="In" font-size="12.5" fill="#a5acb7" text-anchor="middle" class="fade" style="animation-delay:0.7s">validation</text><line x1="790" y1="84" x2="790" y2="268" stroke="#262d37" stroke-width="1.5" stroke-dasharray="3 4" class="fade" style="animation-delay:0.6s"/><text x="790" y="288" font-family="In" font-size="12.5" fill="#a5acb7" text-anchor="middle" class="fade" style="animation-delay:0.7s">official test</text><path d="M640 117.5 L790 246.9" stroke="#ff7f57" stroke-width="3.2" fill="none" stroke-linecap="round" class="draw" style="--l:200;animation-delay:1.0s"/><circle cx="640" cy="117.5" r="5.5" fill="#ff7f57" class="pop" style="animation-delay:1.0s"/><circle cx="790" cy="246.9" r="5.5" fill="#ff7f57" class="pop" style="animation-delay:2.25s"/><text x="626" y="114.49999999999997" font-family="In6" font-size="12.5" fill="#ff7f57" text-anchor="end" class="fade" style="animation-delay:1.0s">split by image</text><text x="626" y="130.49999999999997" font-family="Jb" font-size="11.5" fill="#a5acb7" text-anchor="end" class="fade" style="animation-delay:1.0s">0.853</text><text x="804" y="250.88888888888889" font-family="Jb" font-size="12" fill="#ff7f57" text-anchor="start" class="fade" style="animation-delay:2.25s">0.716</text><path d="M640 187.4 L790 232.7" stroke="#8b97ff" stroke-width="3.2" fill="none" stroke-linecap="round" class="draw" style="--l:159;animation-delay:1.25s"/><circle cx="640" cy="187.4" r="5.5" fill="#8b97ff" class="pop" style="animation-delay:1.25s"/><circle cx="790" cy="232.7" r="5.5" fill="#8b97ff" class="pop" style="animation-delay:2.5s"/><text x="626" y="184.38888888888883" font-family="In6" font-size="12.5" fill="#8b97ff" text-anchor="end" class="fade" style="animation-delay:1.25s">split by lesion</text><text x="626" y="200.38888888888883" font-family="Jb" font-size="11.5" fill="#a5acb7" text-anchor="end" class="fade" style="animation-delay:1.25s">0.779</text><text x="804" y="236.7222222222222" font-family="Jb" font-size="12" fill="#8b97ff" text-anchor="start" class="fade" style="animation-delay:2.5s">0.731</text><text x="725.0" y="170.19444444444443" font-family="Jb" font-size="12.5" fill="#ff7f57" text-anchor="middle" class="rise" style="animation-delay:2.4s">−13.7</text><text x="709.0" y="232.05555555555551" font-family="Jb" font-size="12.5" fill="#8b97ff" text-anchor="middle" class="rise" style="animation-delay:2.55s">−4.8</text></svg>