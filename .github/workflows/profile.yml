# Keeps the profile current: the lab log every day, the cards whenever now.json or the drawing code changes.
name: Profile

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["now.json", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/build_cards.py
      - run: python scripts/update_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "Janat-Yasser"
          git config user.email "Janat-Yasser@users.noreply.github.com"
          git add README.md assets/cards
          git diff --cached --quiet || git commit -m "Update lab log and cards"
          git push
